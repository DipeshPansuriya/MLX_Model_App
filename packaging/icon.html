<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1024px; height: 1024px;
    background: transparent;
    overflow: hidden;
  }
  .stage {
    width: 1024px; height: 1024px;
    display: grid; place-items: center;
  }
  .tile {
    width: 824px; height: 824px;
    border-radius: 186px;
    background:
      radial-gradient(120% 120% at 18% 8%, #7fb0ff 0%, rgba(127,176,255,0) 46%),
      linear-gradient(150deg, #5b95ff 0%, #4f8cff 38%, #6a5cff 72%, #8a4dff 100%);
    box-shadow:
      0 40px 90px rgba(24, 32, 64, .45),
      inset 0 2px 0 rgba(255, 255, 255, .38),
      inset 0 -18px 46px rgba(28, 20, 90, .30);
    display: grid; place-items: center;
    position: relative;
    overflow: hidden;
  }
  .tile::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 186px;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 42%);
  }
  .glyph {
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    font-size: 430px;
    line-height: 1;
    color: #ffffff;
    text-shadow: 0 12px 40px rgba(20, 16, 70, .45);
    transform: translateY(-14px);
    position: relative; z-index: 2;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="tile"><div class="glyph">◈</div></div>
  </div>
</body>
</html>
