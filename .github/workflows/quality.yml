name: Quality

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python3 -m pip install --upgrade pip ruff

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  syntax:
    name: Syntax gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"

      - name: Python compiles
        run: |
          python3 -m py_compile app.py model_info.py mlx_loadtest.py optiq_engine.py engine_runtime.py engines.py login_agent.py chat_store.py projects.py hub_catalog.py live_stats.py tool_null_text.py loadtest_compare.py engine_plan.py update_check.py catalog_routes.py
          python3 -m py_compile scripts/check_secrets.py
          python3 -m py_compile packaging/release_manifest.py

      - name: JavaScript parses
        run: node --check ui/app.js && node --check ui/download.js

      - name: Shell scripts parse
        run: |
          for f in run.sh Run_MLX_Manager.command scripts/*.sh .githooks/*; do
            bash -n "$f"
          done

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Relative links resolve
        run: python3 scripts/check_docs.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python3 -m pip install --upgrade pip pytest

      # app.py imports nothing heavy at module scope, so the suite runs without
      # MLX. macOS-only tests skip themselves via the integration marker.
      - name: Run the suite
        run: python3 -m pytest -q

      - name: Report counts
        if: always()
        run: python3 -m pytest --collect-only -q | tail -3

  macos-build:
    name: macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # requirements.txt is used as a constraints file, so the MLX versions are
      # pinned in one place.
      - name: Install pytest and the pinned MLX packages
        run: |
          python3 -m pip install --upgrade pip pytest
          python3 -m pip install -c requirements.txt mlx mlx-lm huggingface-hub

      # Compiles the launcher and fails if its minos differs from Info.plist.
      - name: Build app, dmg and pkg
        run: ./packaging/build_app.sh

      - name: Built pkg matches the source
        run: python3 packaging/release_manifest.py --inspect --dist dist

      # The macOS-only launcher and build tests skip themselves on Linux.
      - name: Run the suite on macOS
        run: python3 -m pytest -q -rs --junitxml="$RUNNER_TEMP/macos-tests.xml"

      # Only this job runs the build and installer for real, so a skipped or
      # deselected test in these files fails the build.
      - name: Packaging tests ran, none skipped
        run: >-
          python3 .github/scripts/require_no_skips.py "$RUNNER_TEMP/macos-tests.xml"
          tests/test_prerelease_2013.py
          tests/test_app_robustness.py
          tests/test_row_perfmode.py
          tests/test_row1058_alias.py
          tests/test_packaging.py

  release:
    name: Release consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # tags are needed for the tag checks

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Version, manifest and tags agree
        run: python3 packaging/release_manifest.py --check

      - name: Pushed tag matches APP_VERSION
        if: github.ref_type == 'tag'
        run: python3 packaging/release_manifest.py --check --tag "$GITHUB_REF_NAME"

      # A change under release/ may only land when the published assets it
      # describes exist and match, so publish the assets first.
      - name: Published assets match the manifest
        if: github.ref_type != 'tag'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE" HEAD -- release/; then
            echo "release/ unchanged"
            exit 0
          fi
          version="$(python3 -c 'import json; print(json.load(open("release/latest.json"))["version"])')"
          assets="$(mktemp -d)"
          for ext in dmg pkg; do
            name="MLX.Studio-$version.$ext"
            curl -fsSL --retry 3 -o "$assets/$name" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/$name"
          done
          python3 packaging/release_manifest.py --verify --dist "$assets"
