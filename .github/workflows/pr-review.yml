name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Automated review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"

      - name: Install tooling
        run: python3 -m pip install --upgrade pip ruff pip-audit

      - name: Collect findings
        id: collect
        continue-on-error: true
        run: |
          set +e
          {
            echo "### Quality"
            echo ""
            echo '```'
            ruff check --output-format=concise . 2>&1 | tail -40
            echo '```'
            echo ""
            echo "### Formatting"
            echo ""
            echo '```'
            ruff format --check . 2>&1 | tail -10
            echo '```'
            echo ""
            echo "### Secrets"
            echo ""
            echo '```'
            python3 scripts/check_secrets.py 2>&1 | tail -20
            echo '```'
            echo ""
            echo "### Documentation links"
            echo ""
            echo '```'
            python3 scripts/check_docs.py 2>&1 | tail -10
            echo '```'
            echo ""
            echo "### Syntax"
            echo ""
            echo '```'
            python3 -m py_compile app.py model_info.py mlx_loadtest.py optiq_engine.py engine_runtime.py engines.py login_agent.py chat_store.py projects.py hub_catalog.py live_stats.py tool_null_text.py loadtest_compare.py engine_plan.py update_check.py catalog_routes.py project_routes.py && echo "app, model info, load test, engine: ok"
            node --check ui/app.js && node --check ui/download.js && node --check ui/projects.js && echo "ui js: ok"
            for f in run.sh Run_MLX_Manager.command scripts/*.sh .githooks/*; do
              bash -n "$f" && echo "$f: ok"
            done
            echo '```'
          } > /tmp/review.md 2>&1
          cat /tmp/review.md

      - name: Changed files
        id: files
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}" --depth=1 || true
          {
            echo ""
            echo "### Changed files"
            echo ""
            echo "| File | +/- |"
            echo "|---|---|"
            git diff --numstat "origin/${{ github.event.pull_request.base.ref }}...HEAD" \
              | awk '{printf "| `%s` | +%s / -%s |\n", $3, $1, $2}'
          } >> /tmp/review.md
          cat /tmp/review.md

      - name: Post review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/review.md', 'utf8');
            const marker = '<!-- mlx-studio-auto-review -->';
            const header = [
              marker,
              '## Automated review',
              '',
              'Generated by `.github/workflows/pr-review.yml`. This is a **report**, not an',
              'approval: it never approves or blocks on its own. Merge is gated by the',
              'required status checks on `main`.',
              '',
            ].join('\n');
            const full = header + body;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: full,
              });
              core.info(`updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: full,
              });
              core.info('created review comment');
            }
